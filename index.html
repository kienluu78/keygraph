<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyGraph · Always-On Memory Agent · LZRC</title>
<meta name="description" content="KeyGraph is a source-bound memory and continuity layer for AI that must stay honest under real operational load. Memory stays ours. Models are interchangeable.">
<meta name="robots" content="index,follow">
<style>html,body{margin:0;background:#FAF8F5;color:#1B2A4A;font-family:Archivo,system-ui,sans-serif}</style>
<script>
(async function () {
  var src = 'https://raw.githubusercontent.com/kienluu78/keygraph/389327f3cecb63fb8c4a4bab1fc403f6acde17b8/index.html';
  try {
    var res = await fetch(src, { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch ' + res.status);
    var html = await res.text();
    html = html.replace(
      'Luu Zaibatsu Pty Ltd',
      'Luu Zaibatsu Research Collaborative Pty Ltd ' + String.fromCharCode(0x00B7) + ' ACN 702 511 037'
    );
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<main style="padding:48px;max-width:40rem;margin:0 auto">' +
      '<h1 style="font-family:Georgia,serif;font-weight:400">KeyGraph</h1>' +
      '<p>Could not load page.</p>' +
      '<pre style="color:#5C6578;font-size:12px">' + String(e) + '</pre></main>';
  }
})();
</script>
</head>
<body>
  <p style="padding:48px;opacity:.7">Loading KeyGraph...</p>
</body>
</html>
